<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<link rel="stylesheet" type="text/css" href="css/style.css"/>
<style type="text/css">
    h1 { color: #2c3e50; }
</style>
<f:view>
    <h1>Booking Details</h1>

    <h:form>
        <h:panelGrid columns="3">

            <h:outputLabel value="Booking ID"/>
            <h:inputText value="#{bookingBean.booking.bookingId}" required="true"
                         id="bookingId" label="Booking ID" readonly="true">
                <f:validateLength minimum="3" maximum="15"/>
            </h:inputText>
            <h:message for="bookingId" style="color: red"/>

            <h:outputLabel value="Client Name"/>
            <h:inputText value="#{bookingBean.booking.clientName}" required="true"
                         id="clientName" label="Client Name"
                         validatorMessage="Client name must be between 2 and 60 characters.">
                <f:validateLength minimum="2" maximum="60"/>
            </h:inputText>
            <h:message for="clientName" style="color: red"/>

            <h:outputLabel value="Event Type"/>
            <h:inputText value="#{bookingBean.booking.eventType}" required="true"
                         id="eventType" label="Event Type"
                         validatorMessage="Event type should contain letters and spaces only (e.g. Wedding, Graduation).">
                <f:validateRegex pattern="^[A-Za-z ]+$"/>
            </h:inputText>
            <h:message for="eventType" style="color: red"/>

            <h:outputLabel value="Event Date (yyyy-MM-dd)"/>
            <h:inputText value="#{bookingBean.booking.eventDate}" required="true"
                         id="eventDate" label="Event Date"
                         validator="#{bookingBean.validateEventDate}">
                <f:converter converterId="localDateConverter"/>
            </h:inputText>
            <h:message for="eventDate" style="color: red"/>

            <h:outputLabel value="Status"/>
            <h:selectOneMenu value="#{bookingBean.booking.status}" required="true"
                             id="status" label="Status">
                <f:selectItem itemValue="Pending" itemLabel="Pending"/>
                <f:selectItem itemValue="Confirmed" itemLabel="Confirmed"/>
                <f:selectItem itemValue="Completed" itemLabel="Completed"/>
                <f:selectItem itemValue="Cancelled" itemLabel="Cancelled"/>
            </h:selectOneMenu>
            <h:message for="status" style="color: red"/>

            <h:commandButton value="Save" action="#{bookingBean.saveBooking}"
                             rendered="#{empty bookingBean.booking.createdAt}"/>

            <h:commandButton value="Update" action="#{bookingBean.updateBooking}"
                             rendered="#{not empty bookingBean.booking.createdAt}"/>

            <h:commandButton value="Cancel" action="bookingList?faces-redirect=true"
                             immediate="true" style="margin-left:8px; background-color:#6b7280;"/>
        </h:panelGrid>
    </h:form>
</f:view>
</html>
