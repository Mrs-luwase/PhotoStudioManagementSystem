<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<link rel="stylesheet" type="text/css" href="css/style.css"/>
<f:view>
    <h1>Staff List</h1>

    <h:form>
        <h:commandButton value="+ New Staff Member" action="#{staffMemberBean.prepareNew}"/>

        <h:dataTable value="#{staffMemberBean.staffList}" var="s" border="2">
            <h:column><f:facet name="header">Staff ID</f:facet>#{s.staffId}</h:column>
            <h:column><f:facet name="header">Full Name</f:facet>#{s.fullName}</h:column>
            <h:column><f:facet name="header">Role</f:facet>#{s.role}</h:column>
            <h:column><f:facet name="header">Phone Number</f:facet>#{s.phoneNumber}</h:column>
            <h:column>
                <f:facet name="header">Actions</f:facet>
                <h:commandLink value="Edit" action="#{staffMemberBean.prepareEdit(s.staffId)}"/>
                &#160;|&#160;
                <h:commandLink value="Delete" action="#{staffMemberBean.deleteStaff(s.staffId)}"
                               onclick="return confirm('Delete this staff member?');"/>
            </h:column>
        </h:dataTable>
    </h:form>
</f:view>
</html>
