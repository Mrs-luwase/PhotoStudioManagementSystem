<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<f:view>
    <h:head>
        <title>Photography Studio Management System</title>
        <link rel="stylesheet" type="text/css" href="css/style.css"/>
        <style type="text/css">
            body { padding: 0; }
        </style>
    </h:head>
    <h:body>
        <div class="dashboard-wrap">
            <div class="dashboard-card">
                <h1>Photography Studio</h1>
                <p class="dashboard-sub">Manage your bookings and your team in one place.</p>

                <h:form>
                    <div class="dashboard-actions">
                        <h:commandButton value="Manage Bookings" action="bookingList?faces-redirect=true"/>
                        <h:commandButton value="Manage Staff" action="staffList?faces-redirect=true"
                                         styleClass="btn-outline"/>
                    </div>
                </h:form>
            </div>
        </div>
    </h:body>
</f:view>
</html>
