<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<link rel="stylesheet" type="text/css" href="css/style.css"/>
<f:view>
    <h1>Staff Member Saved</h1>
    <p>The staff record below has been saved successfully.</p>

    <h:panelGrid columns="2">
        <h:outputText value="Staff ID:"/>
        <h:outputText value="#{staffMemberBean.staff.staffId}"/>

        <h:outputText value="Full Name:"/>
        <h:outputText value="#{staffMemberBean.staff.fullName}"/>

        <h:outputText value="Role:"/>
        <h:outputText value="#{staffMemberBean.staff.role}"/>

        <h:outputText value="Phone Number:"/>
        <h:outputText value="#{staffMemberBean.staff.phoneNumber}"/>
    </h:panelGrid>

    <h:form>
        <h:commandButton value="Back to Staff List" action="staffList?faces-redirect=true" style="margin-top:15px;"/>
    </h:form>
</f:view>
</html>
